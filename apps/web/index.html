<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/grindz-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Grindz — log lifts, chase PRs, and see exactly what you've trained." />
    <title>Grindz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!--
      Startup animation.

      Inlined rather than rendered by React on purpose: this has to paint on the very first
      frame, before the bundle has parsed. A React splash cannot — by the time it mounts the
      wait it was meant to cover is already over, and you get a flash of black instead.

      The mark is a stroked glyph, so it draws itself: each sub-path is dashed to its own
      length and the offset animates to zero, followed by a single sweep of light. The layer
      fades once the app signals ready. Budget ~1.4s, and it never blocks — `app-ready` clears
      it whenever React mounts, early or late.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #050505;
        background-image: radial-gradient(circle at 50% 42%, #0a1f33 0%, #050505 62%);
        /* short: this runs AFTER the app has painted, so it is pure overhead on the wait */
        transition: opacity 0.2s ease-out, visibility 0.2s;
      }
      #boot .wrap {
        display: grid;
        place-items: center;
        gap: 22px;
        animation: boot-settle 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot svg { width: 96px; height: 96px; overflow: visible; }
      /*
        The mark is a stroked icon, so it can draw itself: dash the outline to its own length
        and animate the offset to zero. That is why the paths carry pathLength="1" — it
        normalises every sub-path so one duration covers them all regardless of real length.
      */
      #boot .st {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: boot-draw 0.85s cubic-bezier(0.65, 0, 0.35, 1) both;
      }
      #boot .d1 { animation-delay: 0.04s; }
      #boot .d2 { animation-delay: 0.30s; }
      #boot .d3 { animation-delay: 0.14s; }
      #boot .d4 { animation-delay: 0.20s; }
      #boot .d5 { animation-delay: 0.30s; }
      #boot .word {
        font-family: Poppins, system-ui, sans-serif;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #fff;
        opacity: 0;
        animation: boot-word 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.62s both;
      }
      /*
        One specular sweep once the glyph has finished drawing.

        The element does NOT move. Moving it is what produced the reported artifact: the mask
        travels with the element, so translating it drags the masked glyph across the screen
        and paints a second, grey dumbbell sliding past the real one. A highlight has to stay
        inside the shape it is highlighting.

        So the element is pinned over the mark with `inset: 0` and the *gradient* is what
        travels, via `background-position` across a background three times the width. The mask
        never moves, which means nothing can ever be drawn outside the glyph's own bounds.

        `forwards`, never `both`. With `both` the start state applies during the 0.86s delay,
        which paints the glyph before the sweep is due. `forwards` leaves the element on its
        own styles until then, and those styles are opacity: 0.
      */
      #boot .sheen {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.55) 50%, transparent 60%);
        background-size: 300% 100%;
        background-position: 100% 0;
        background-repeat: no-repeat;
        -webkit-mask-image: url('/grindz-mark.svg');
        mask-image: url('/grindz-mark.svg');
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        opacity: 0;
        animation: boot-sheen 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.86s forwards;
      }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-word {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes boot-sheen {
        0%   { opacity: 0; background-position: 100% 0; }
        12%  { opacity: 1; }
        88%  { opacity: 1; }
        100% { opacity: 0; background-position: 0% 0; }
      }
      @keyframes boot-settle {
        from { transform: scale(0.97); }
        to   { transform: scale(1); }
      }
      html.app-ready #boot { opacity: 0; visibility: hidden; }
      /* Respect reduced motion: keep the brand frame, drop the choreography. */
      @media (prefers-reduced-motion: reduce) {
        #boot .wrap, #boot .st, #boot .word { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
        #boot .sheen { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Grindz">
      <div class="wrap">
        <div style="position: relative; display: grid; place-items: center">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="bg1" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#00c6ff" />
                <stop offset="100%" stop-color="#0072ff" />
              </linearGradient>
            </defs>
            <g fill="none" stroke="url(#bg1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path class="st d1" pathLength="1" d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z" />
              <path class="st d2" pathLength="1" d="m2.5 21.5 1.4-1.4" />
              <path class="st d3" pathLength="1" d="m20.1 3.9 1.4-1.4" />
              <path class="st d4" pathLength="1" d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z" />
              <path class="st d5" pathLength="1" d="m9.6 14.4 4.8-4.8" />
            </g>
          </svg>
          <span class="sheen"></span>
        </div>
        <span class="word">Grindz</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
