<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#00c6ff" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Dark Background (App Icon Shape) -->
  <rect width="512" height="512" rx="112" fill="#050505" />
  
  <!-- Subtle Inner Glass Panel -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#0a0a0f" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- The "C" (Progression Ring) -->
  <path 
    d="M 355 157 A 140 140 0 1 0 355 355" 
    fill="none" 
    stroke="url(#cyan-grad)" 
    stroke-width="48" 
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- PR / Progression Arrow Inside -->
  <path
    d="M 170 300 L 220 240 L 260 280 L 330 190"
    fill="none"
    stroke="#ffffff"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 270 190 L 330 190 L 330 250"
    fill="none"
    stroke="#ffffff"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
